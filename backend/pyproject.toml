[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aftersales-agent"
version = "0.0.1"
description = "企业售后工单智能处理系统原型"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3", "alembic>=1,<2", "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "pgvector>=0.4,<1", "uvicorn>=0.34,<1",
  "python-multipart==0.0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated P00 PostgreSQL test database"]
